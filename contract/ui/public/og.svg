      <stop offset="0%" stop-color="#3a3016" />
      <stop offset="52%" stop-color="#20242e" />
      <stop offset="100%" stop-color="#171a22" />
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <g transform="translate(980 -60) scale(19)" opacity="0.9">
