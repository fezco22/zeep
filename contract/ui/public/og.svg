  <text x="80" y="330" fill="#f6f1e4" font-family="Georgia, 'Times New Roman', serif" font-size="90" font-weight="700" letter-spacing="-2.5">Get paid by username.</text>
  <text x="80" y="428" fill="#c7a45a" font-family="Georgia, 'Times New Roman', serif" font-size="90" font-weight="700" letter-spacing="-2.5">Stay private.</text>
  <text x="80" y="520" fill="#b9b1a0" font-size="30">Share a handle. The chain never sees who paid, how much,</text>
