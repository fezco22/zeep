name: ci

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Compact compiler
        run: npx fetch-compactc --version=0.31.1

      - name: Compile contract
        run: npm run compile

      - name: Compile archived v2 proving assets for the app build
        run: npm run compile:v2

      - name: Test
        run: npm test

      - name: Install app dependencies
        working-directory: contract/ui
        run: npm ci --no-audit --no-fund

      - name: Typecheck and build app
        working-directory: contract/ui
        run: |
          npx tsc --noEmit -p tsconfig.json
          npm run build
